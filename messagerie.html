<!DOCTYPE html>
<html lang="fr" class="page-messaging">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Écrivez à vos contacts : chaque message est confié au facteur de votre choix et arrive quand il arrive.">
    <title>OOPS Livraison - Messagerie</title>
    <link rel="icon" href="./images/svg/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./scripts/main.js"></script>
</head>

<body>
    <header id="header" class="site-header"></header>

    <main id="content" class="messaging">
        <aside class="conversation-list">
            <h1>Messages</h1>
            <a id="newConversation" class="btn btn-icon" href="#">
                <img src="./images/svg/plus.svg" alt="" width="16" height="16">
                Nouveau
            </a>
            <div class="field">
                <label>
                    <span>Rechercher</span>
                    <input id="searchInput" type="search" name="recherche" placeholder="Nom, pseudo, message…" autocomplete="off">
                </label>
            </div>
            <ul id="conversationList"></ul>
        </aside>
        <section class="conversation">
            <header id="conversationHeader" class="conversation-header"></header>
            <ol id="thread" class="thread"></ol>
            <form id="composerForm" class="composer">
                <fieldset>
                    <legend>Facteur :</legend>
                    <div id="composerCouriers" class="chip-list"></div>
                </fieldset>
                <label class="btn btn-outline">
                    <input class="visually-hidden" type="file" name="photo" accept="image/*">
                    <span aria-hidden="true">+</span>
                    <span>Photo</span>
                </label>
                <label>
                    <span class="visually-hidden">Votre message</span>
                    <textarea name="message" rows="1" placeholder="Votre message…" required></textarea>
                </label>
                <button class="btn btn-icon" type="submit">
                    <img src="./images/svg/plus.svg" alt="" width="16" height="16">
                    Envoyer
                </button>
                <p class="field-error" role="alert" hidden></p>
                <p id="composerHint" class="field-hint"></p>
            </form>
        </section>
    </main>

</body>

</html>
