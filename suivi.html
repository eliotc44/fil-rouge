<!DOCTYPE html>
<html lang="fr" class="page-tracking">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Suivez en direct la position de vos facteurs et l’heure d’arrivée prévue de chacun de vos messages.">
    <title>OOPS Livraison - Suivi des messages</title>
    <link rel="icon" href="./images/svg/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./scripts/main.js"></script>
</head>

<body>
    <header id="header" class="site-header"></header>

    <main id="content">
        <section class="hero">
            <img class="logo" src="./images/svg/logo.svg" alt="" width="106" height="106">
            <div>
                <h1>Suivi de vos messages</h1>
                <p>Suivez en direct la position de vos facteurs, du départ jusqu’à la boîte aux lettres</p>
                <a class="btn btn-large btn-icon" href="./messagerie.html">
                    <img src="./images/svg/plus.svg" alt="" width="16" height="16">
                    Programmer un nouvel envoi
                </a>
            </div>
            <img class="cap" src="./images/svg/casquette.svg" alt="" width="189" height="96">
        </section>

        <section>
            <hgroup class="section-title">
                <h2>En cours de livraison</h2>
                <p id="trackingCount">variable messages sont actuellement entre les mains de nos facteurs</p>
            </hgroup>
            <div class="filters" role="group" aria-label="Filtrer les suivis">
                <button type="button" value="tous" aria-pressed="true">Tous (variable)</button>
                <button type="button" value="envoyes" aria-pressed="false">Envoyés (variable)</button>
                <button type="button" value="recus" aria-pressed="false">Reçus (variable)</button>
            </div>
            <ul id="trackingList" class="tracking-list"></ul>
        </section>
    </main>

    <footer id="footer" class="site-footer"></footer>

</body>

</html>
