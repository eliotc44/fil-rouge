<!DOCTYPE html>
<html lang="fr" class="page-profile">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Votre profil OOPS Livraison : statistiques d’envoi, informations de compte et facteurs préférés.">
    <title>OOPS Livraison - Profil</title>
    <link rel="icon" href="./images/svg/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./scripts/main.js"></script>
</head>

<body>
    <header id="header" class="site-header"></header>

    <main id="content">
        <section class="profile-hero">
            <img class="avatar" src="./images/variable.webp" alt="" width="160" height="160">
            <div id="profileIdentity"></div>
            <a class="btn btn-large" href="./reglages.html">Modifier le profil</a>
        </section>

        <section>
            <hgroup class="section-title">
                <h2>Mes statistiques</h2>
                <p>Votre vie de messagerie, en chiffres (plus ou moins exacts)</p>
            </hgroup>
            <ul id="profileStats" class="stats"></ul>
        </section>

        <section>
            <div class="profile-cards">
                <article class="profile-card">
                    <h2>Mes informations</h2>
                    <dl id="profileInfo" class="info-list"></dl>
                    <a class="btn btn-large btn-outline" href="./reglages.html#compte">Modifier mes informations</a>
                </article>
                <article class="profile-card">
                    <h2>Mes facteurs préférés</h2>
                    <p>Classés selon le nombre de messages qu’ils vous ont livrés</p>
                    <ol id="rankList" class="rank-list"></ol>
                    <a class="btn btn-large btn-outline" href="./nos-livreurs.html">Voir tous les livreurs</a>
                </article>
            </div>
        </section>
    </main>

    <footer id="footer" class="site-footer"></footer>

</body>

</html>
